  <script>
    (function(){
      if(location.pathname.endsWith('/')) history.replaceState({},'', '/blog/navier-stokes-ai-discovery');

      function escapeHtml(text){return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
      function tables(text){
        const lines=text.split('\n'),out=[];let i=0;
        const align=l=>/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(l);
        const row=l=>/^\s*\|.*\|\s*$/.test(l);
        const cells=l=>l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(x=>x.trim());
        while(i<lines.length){
          if(i+1<lines.length&&row(lines[i])&&align(lines[i+1])){const h=cells(lines[i]);i+=2;const rows=[];while(i<lines.length&&row(lines[i]))rows.push(cells(lines[i++]));out.push('<table><thead><tr>'+h.map(c=>'<th>'+escapeHtml(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+escapeHtml(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>')}else out.push(lines[i++]);
        }
        return out.join('\n');
      }
      function parseMarkdown(text){
        const mathBlocks=[],inlineMath=[],codeBlocks=[];
        text=text.replace(/\$\$([\s\S]*?)\$\$/g,m=>(mathBlocks.push(m),'%%MATHBLOCK'+(mathBlocks.length-1)+'%%'));
        text=text.replace(/\$([^\$\d\n][^\$\n]*?)\$/g,m=>(inlineMath.push(m),'%%INLINEMATH'+(inlineMath.length-1)+'%%'));
        text=text.replace(/```([\s\S]*?)```/g,(m,c)=>(codeBlocks.push(c),'%%CODEBLOCK'+(codeBlocks.length-1)+'%%'));
        text=tables(text);
        text=text.replace(/^---$/gim,'<hr>').replace(/^### (.*$)/gim,'<h3>$1</h3>').replace(/^## (.*$)/gim,'<h2>$1</h2>').replace(/^# (.*$)/gim,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/gim,'<strong>$1</strong>').replace(/!\[(.*?)\]\((.*?)\)/gim,'<img src="$2" alt="$1" loading="lazy">').replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/gim,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/^> (.*$)/gim,'<blockquote>$1</blockquote>').replace(/`([^`]+)`/gim,'<code>$1</code>').replace(/\n\n/gim,'</p><p>').replace(/\n/gim,'<br>');
        codeBlocks.forEach((code,i)=>{const lines=code.split('\n'),first=lines[0].trim(),isLang=/^[a-zA-Z0-9#+\-]+$/.test(first)&&first.length<20,body=isLang?lines.slice(1).join('\n'):code;text=text.replace('%%CODEBLOCK'+i+'%%','<pre><code>'+escapeHtml(body.trim())+'</code></pre>')});
        mathBlocks.forEach((m,i)=>text=text.replace('%%MATHBLOCK'+i+'%%','<div class="math-display">'+m+'</div>'));
        inlineMath.forEach((m,i)=>text=text.replace('%%INLINEMATH'+i+'%%','<span class="math-inline">'+m+'</span>'));
        return '<p>'+text+'</p>';
      }
      fetch('/blogs/navier_stokes_ai_discovery.md',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(text=>{
        const content=text.replace(/^---[\s\S]*?---\s*/,'');
        const article=document.getElementById('article');
        article.innerHTML=parseMarkdown(content);
        const firstItalic=article.querySelector('p > em:first-child'); if(firstItalic) firstItalic.closest('p')?.remove();
        if(window.MathJax&&window.MathJax.typesetPromise) window.MathJax.typesetPromise([article]);
      }).catch(()=>{document.getElementById('article').innerHTML='<p>The article could not be loaded. Please return to the blog and try again.</p>'});
    })();
